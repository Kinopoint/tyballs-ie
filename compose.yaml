services:
  database:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tyballs
      POSTGRES_USER: tyballs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyballs -d tyballs"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - tyballs_database:/var/lib/postgresql
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  website:
    image: tyballs-website:local
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_ENABLED: ${NEXT_PUBLIC_TURNSTILE_ENABLED:?NEXT_PUBLIC_TURNSTILE_ENABLED is required}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tyballs:${POSTGRES_PASSWORD}@database:5432/tyballs
      CMS_MEDIA_DIRECTORY: /app/media
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ${CMS_MEDIA_HOST_DIRECTORY:-./cms-media}:/app/media
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  retention:
    image: tyballs-website:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      database:
        condition: service_healthy
      website:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tyballs:${POSTGRES_PASSWORD}@database:5432/tyballs
    command: ["node", "scripts/retention.mjs"]
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  cms-tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    init: true
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tyballs:${POSTGRES_PASSWORD}@database:5432/tyballs
      CMS_MEDIA_DIRECTORY: /app/media
    volumes:
      - ${CMS_MEDIA_HOST_DIRECTORY:-./cms-media}:/app/media
    networks: [internal]

  backup:
    image: postgres:18.4-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tyballs:${POSTGRES_PASSWORD}@database:5432/tyballs
      CMS_MEDIA_DIRECTORY: /media
    command: ["sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ${BACKUP_HOST_DIRECTORY:-./backups}:/backups
      - ${CMS_MEDIA_HOST_DIRECTORY:-./cms-media}:/media:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    networks: [internal]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tyballs_database:

networks:
  internal:
    driver: bridge
