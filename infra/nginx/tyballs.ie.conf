limit_req_zone $binary_remote_addr zone=enquiry_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tyballs.ie www.tyballs.ie;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /tyballs-ie {
        return 301 https://tyballs.ie/;
    }

    location ^~ /tyballs-ie/ {
        rewrite ^/tyballs-ie/(.*)$ https://tyballs.ie/$1 permanent;
    }

    location / {
        return 301 https://tyballs.ie$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tyballs.ie;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tyballs.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyballs.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /tyballs-ie {
        return 301 https://tyballs.ie/;
    }

    location ^~ /tyballs-ie/ {
        rewrite ^/tyballs-ie/(.*)$ https://tyballs.ie/$1 permanent;
    }

    location / {
        return 301 https://tyballs.ie$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tyballs.ie;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tyballs.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyballs.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    location = /tyballs-ie {
        return 301 https://tyballs.ie/;
    }

    location ^~ /tyballs-ie/ {
        rewrite ^/tyballs-ie/(.*)$ /$1 permanent;
    }

    location = /api/enquiries {
        limit_req zone=enquiry_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /cms-api/media {
        client_max_body_size 160m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        access_log off;
    }

    location ^~ /cms-api/media/file/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    location ~* ^/(?:brand|icons|images|og|video)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
