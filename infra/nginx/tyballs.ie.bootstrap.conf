server {
    listen 80;
    listen [::]:80;
    server_name tyballs.ie www.tyballs.ie;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://tyballs.ie$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tyballs.ie;

    ssl_certificate /etc/letsencrypt/live/tyballs.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyballs.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tyballs.ie$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tyballs.ie;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tyballs.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyballs.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/tyballs-preview;

    location = / {
        return 302 /tyballs-ie/;
    }

    location /tyballs-ie/_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /tyballs-ie/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /tyballs-ie/404.html;
    }
}
